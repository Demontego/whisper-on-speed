version: '3'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PROJECT_ID=${GOOGLE_CLOUD_PROJECT}
      - SKIP_WARMUP=1
      - GOOGLE_APPLICATION_CREDENTIALS=/gcloud-creds/application_default_credentials.json
    volumes:
      - ~/.config/gcloud:/gcloud-creds:ro
